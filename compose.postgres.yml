services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: vc_scope
      POSTGRES_USER: vc_scope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vc_scope_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vc_scope -d vc_scope"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  vc_scope_postgres:
