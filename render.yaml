services:
  - type: web
    name: vc-scope-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-platform.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --no-access-log
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////tmp/antigravity.db
      - key: FRONTEND_URL
        value: https://vc-scope-os.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: SERPER_API_KEY
        sync: false
